[workspace]
members = [".", "crates/tapchat_transport_adapter", "app/desktop/src-tauri"]
exclude = ["third_party/rust/hpke-rs"]
resolver = "2"

[package]
name = "TapChat"
version = "0.1.15"
edition = "2021"
publish = false

[lib]
name = "tapchat_core"
path = "src/lib.rs"

[features]
default = []
# The retired transport fixture modeled one Worker as several users' runtime.
# It is retained only to aid historical comparisons and is incompatible with
# the v3 one-runtime/one-root-identity security model.
legacy-multi-owner-runtime-tests = []

[[test]]
name = "desktop_group_e2e"
path = "tests/desktop_group_e2e.rs"
required-features = ["legacy-multi-owner-runtime-tests"]

[[test]]
name = "desktop_message_request_e2e"
path = "tests/desktop_message_request_e2e.rs"
required-features = ["legacy-multi-owner-runtime-tests"]

[[bin]]
name = "tapchat"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
fs2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
openmls = { version = "0.8.1", features = ["openmls_rust_crypto"] }
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"
url = "2.5"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }

[dev-dependencies]
tapchat_transport_adapter = { path = "crates/tapchat_transport_adapter" }
tapchat-desktop = { path = "app/desktop/src-tauri", default-features = false, features = ["test-support"] }
proptest = "1.11"

# hpke-rs 0.6.1 pins libcrux-sha3 0.0.8, which is affected by
# RUSTSEC-2026-0207 and RUSTSEC-2026-0208 and pulls in the
# RUSTSEC-2026-0212-affected libcrux-secrets 0.0.5. The four hpke-rs packages
# must stay on one upstream commit because that commit changed their shared
# provider API. Only package manifests are patched; Rust sources are unchanged.
[patch.crates-io]
hpke-rs = { path = "third_party/rust/hpke-rs" }
hpke-rs-crypto = { path = "third_party/rust/hpke-rs/traits" }
hpke-rs-rust-crypto = { path = "third_party/rust/hpke-rs/rust_crypto_provider" }
hpke-rs-libcrux = { path = "third_party/rust/hpke-rs/libcrux_provider" }
