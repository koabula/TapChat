[package]
name = "tapchat-desktop"
version = "0.1.17"
edition = "2021"
publish = false

[lib]
name = "tapchat_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["gui"]
gui = [
    "tauri/wry",
    "tauri/tray-icon",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-log",
]
# Exposes test helpers (`build_test_app_state_for_profile`,
# `drive_core_without_handle`, and `pub use`-re-exports of the group
# command `_impl` functions) that the desktop integration test
# `tests/desktop_group_e2e.rs` in the root crate depends on. Not
# enabled in production builds.
test-support = ["tauri/wry"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
http = "1"
urlencoding = "2.1"
url = "2.5"
log = "0.4"
tapchat_core = { path = "../../../", package = "TapChat" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
open = "5"
rand = "0.8"
zeroize = "1"
blurhash = "0.2.3"
webp = "0.3.1"
fs2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }
