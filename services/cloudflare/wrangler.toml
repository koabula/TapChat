name = "tapchat-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-03-30"

[vars]
PUBLIC_BASE_URL = "https://example.com"
DEPLOYMENT_REGION = "local"
MAX_INLINE_BYTES = "4096"
RETENTION_DAYS = "30"
MESSAGE_REQUEST_MAX_BODY_BYTES = "327680"
MESSAGE_REQUEST_MAX_PER_SENDER = "16"
MESSAGE_REQUEST_MAX_SENDERS = "64"
MESSAGE_REQUEST_MAX_TOTAL_BYTES = "4194304"
MESSAGE_REQUEST_TTL_SECONDS = "604800"
MESSAGE_REQUEST_RATE_LIMIT_MINUTE = "30"
MESSAGE_REQUEST_RATE_LIMIT_HOUR = "300"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "InboxDurableObject"

[[durable_objects.bindings]]
name = "GROUP_OUTBOX"
class_name = "GroupOutboxDurableObject"

[[r2_buckets]]
binding = "TAPCHAT_STORAGE"
bucket_name = "tapchat-storage"
preview_bucket_name = "tapchat-storage-preview"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GroupOutboxDurableObject"]
