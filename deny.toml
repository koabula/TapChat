[graph]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
# The reasoning for each entry is in .cargo/audit.toml. Only advisories on
# crates in this graph are listed; it leaves out the desktop's gui feature.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only under P-256/P-384/K-256, which TapChat's X25519/Ed25519 MLS suite never uses on secrets" },
  { id = "RUSTSEC-2026-0459", reason = "patched libsqlite3-sys still builds SQLCipher on SQLite 3.53.4; TapChat opens only its own state.db" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
exceptions = [
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
