name: Security Storage

on:
  pull_request:
  push:
    branches: [main]

env:
  RUST_MIN_STACK: "67108864"

jobs:
  cargo-security-storage:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows Perl for vendored SQLCipher OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install strawberryperl -y

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf dbus-x11 gnome-keyring libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace

      - name: Test passphrase-only profile security storage
        run: |
          cargo test -q --lib profile_crypto
          cargo test -q --lib local_store
          cargo test -q --lib cli::profile
          cargo test -q --test cli_e2e cli_profile_weak_passphrase_requires_explicit_allow_flag
          cargo test -q --test cli_e2e cli_profile_short_passphrase_stdin_shows_storage_diagnostics
          cargo test -q --test cli_e2e cli_profile_lock_blocks_second_process
