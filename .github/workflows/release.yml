name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.8'
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_MIN_STACK: 67108864

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      release_version: ${{ steps.release-version.outputs.release_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve release version
        id: release-version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_version="${INPUT_VERSION}"
            release_version="${release_version#v}"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${release_version}" =~ ${semver} ]]; then
            echo "Invalid release version: ${release_version}" >&2
            exit 1
          fi

          release_tag="v${release_version}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      - name: Install desktop dependencies for signing validation
        working-directory: app/desktop
        run: npm ci

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_B64}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_B64 secret." >&2
            exit 1
          fi

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret." >&2
            exit 1
          fi

          if ! signing_key="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_B64}" | base64 --decode 2>/dev/null)"; then
            echo "TAURI_SIGNING_PRIVATE_KEY_B64 is not valid base64." >&2
            exit 1
          fi

          if [ -z "${signing_key}" ]; then
            echo "Decoded updater signing key is empty." >&2
            exit 1
          fi

          escaped_signing_key="${signing_key//'%'/'%25'}"
          escaped_signing_key="${escaped_signing_key//$'\r'/'%0D'}"
          escaped_signing_key="${escaped_signing_key//$'\n'/'%0A'}"
          echo "::add-mask::${escaped_signing_key}"

          signing_key_path="${RUNNER_TEMP}/tauri-signing.key"
          printf '%s' "${signing_key}" > "${signing_key_path}"
          chmod 600 "${signing_key_path}"

          printf 'TapChat updater signing validation\n' > "${RUNNER_TEMP}/tauri-signing-validation.txt"
          cd app/desktop
          if ! TAURI_SIGNING_PRIVATE_KEY="${signing_key}" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" npx tauri signer sign "${RUNNER_TEMP}/tauri-signing-validation.txt" >/dev/null; then
            echo "Decoded updater signing key could not sign with Tauri CLI. Check the key and password secrets." >&2
            exit 1
          fi

  build:
    needs: [quality, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            target: ''
            build_args: ''
          - platform: windows
            runner: windows-latest
            target: ''
            build_args: ''
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            build_args: '--target x86_64-apple-darwin'
          - platform: macos-arm
            runner: macos-latest
            target: aarch64-apple-darwin
            build_args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Configure Cargo target directory
        shell: pwsh
        run: |
          $cargoTargetDir = Join-Path $env:RUNNER_TEMP "tapchat-target-${{ matrix.platform }}"
          "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Windows SQLCipher/OpenSSL build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install strawberryperl -y

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf dbus-x11 gnome-keyring libdbus-1-dev

      - name: Generate macOS icon.icns from PNG
        if: matrix.platform == 'macos-intel' || matrix.platform == 'macos-arm'
        run: |
          cd app/desktop/src-tauri/icons
          mkdir -p icon.iconset
          sips -z 16 16 icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset

      - name: Add Rust target for macOS
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-targets: false
          workspaces: |
            .
            app/desktop/src-tauri

      - run: cd app/desktop && npm ci

      - name: Prepare Tauri updater signing key
        id: tauri-signing-key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_B64)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_B64 secret."
          }

          try {
            $keyBytes = [Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY_B64)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 is not valid base64."
          }

          $keyText = [Text.Encoding]::UTF8.GetString($keyBytes)
          if ([string]::IsNullOrWhiteSpace($keyText)) {
            throw "Decoded updater signing key is empty."
          }

          $escapedKeyText = $keyText.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::add-mask::$escapedKeyText"

          $keyPath = Join-Path $env:RUNNER_TEMP "tauri-signing.key"
          [IO.File]::WriteAllBytes($keyPath, $keyBytes)

          $delimiter = "TAURI_SIGNING_PRIVATE_KEY_$([Guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $keyText
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $delimiter

          "path=$keyPath" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: app/desktop
          tagName: ${{ needs.validate.outputs.release_tag }}
          releaseName: 'TapChat ${{ needs.validate.outputs.release_tag }}'
          releaseBody: 'See assets below for platform-specific installers.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.build_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify bundled runtime resources
        shell: pwsh
        run: |
          $embeddedRoot = Join-Path $env:GITHUB_WORKSPACE "app/desktop/src-tauri/embedded"
          $worker = Join-Path $embeddedRoot "worker.js"
          if (-not (Test-Path -LiteralPath $worker -PathType Leaf)) {
            throw "embedded/worker.js is missing"
          }
          $unexpectedEmbedded = Get-ChildItem -LiteralPath $embeddedRoot -Recurse -File | Where-Object {
            $_.FullName -ne $worker
          }
          if ($unexpectedEmbedded) {
            $unexpectedEmbedded.FullName | ForEach-Object { Write-Error "Unexpected embedded resource: $_" }
            throw "Desktop source resources must contain only embedded/worker.js"
          }

          $bundleDirectories = Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -Directory | Where-Object {
            $_.Name -eq "bundle"
          }
          if (-not $bundleDirectories) {
            throw "Tauri bundle output directory is missing"
          }
          $bundleFiles = $bundleDirectories | ForEach-Object {
            Get-ChildItem -LiteralPath $_.FullName -Recurse -File
          }
          $stagedWorkers = Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File -Filter "worker.js"
          if (-not $stagedWorkers) {
            throw "Tauri target output does not contain bundled worker.js"
          }

          switch ("${{ matrix.platform }}") {
            "windows" {
              if (-not ($bundleFiles | Where-Object Extension -eq ".msi")) { throw "Windows MSI is missing" }
              if (-not ($bundleFiles | Where-Object Extension -eq ".exe")) { throw "Windows NSIS installer is missing" }
            }
            "linux" {
              foreach ($extension in @(".AppImage", ".deb", ".rpm")) {
                if (-not ($bundleFiles | Where-Object Extension -eq $extension)) {
                  throw "Linux $extension bundle is missing"
                }
              }
            }
            default {
              if (-not ($bundleDirectories | ForEach-Object {
                Get-ChildItem -LiteralPath $_.FullName -Recurse -Directory -Filter "*.app"
              })) { throw "macOS app bundle is missing" }
              if (-not ($bundleFiles | Where-Object Extension -eq ".dmg")) { throw "macOS DMG is missing" }
            }
          }

          $forbidden = Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File | Where-Object {
            $_.Name -in @("node", "node.exe", "login.mjs", "whoami.mjs", "tapchat_desktop_lib.dll", "libtapchat_desktop_lib.so", "libtapchat_desktop_lib.dylib") -or
              $_.FullName -match '[\\/]embedded[\\/]wrangler([\\/]|$)'
          }
          if ($forbidden) {
            $forbidden.FullName | ForEach-Object { Write-Error "Forbidden bundled artifact: $_" }
            throw "Desktop bundle contains removed runtime artifacts"
          }

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed cross-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false
